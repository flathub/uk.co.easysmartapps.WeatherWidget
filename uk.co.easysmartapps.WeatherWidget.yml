# Flatpak manifest for WeatherWidget — FLATHUB SUBMISSION VARIANT
#
# App ID:  uk.co.easysmartapps.WeatherWidget
# Runtime: GNOME Platform 51
# Build:   Go + native GTK3 (gotk3) + libayatana-appindicator3, CGO enabled.
#
# This is the submission manifest: the source is pinned to a git tag+commit
# (Flathub requirement) instead of the local `type: dir` used for iteration.
# It is otherwise identical to flatpak/uk.co.easysmartapps.WeatherWidget.yml
# in the app repo.

app-id: uk.co.easysmartapps.WeatherWidget
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: weatherwidget

finish-args:
  # Weather data is fetched over HTTPS from provider APIs.
  - --share=network
  # GUI: the widget renders with GTK3 and needs a display server.
  #
  # WeatherWidget is a *positioned* desktop widget — the user chooses an
  # absolute on-screen location. Native Wayland forbids clients from setting
  # their own absolute window position, so under a pure Wayland backend the
  # compositor centres the widget and ignores the saved coordinates. To honour
  # the user's position we run on XWayland (as the deb/rpm/appimage/snap builds
  # do), which needs a real X11 socket.
  - --socket=x11
  # Force the GTK/GDK X11 backend so the app connects to XWayland and its X11
  # positioning path is used. Mirrors the Snap (which also sets GDK_BACKEND=x11).
  - --env=GDK_BACKEND=x11
  # Shared IPC (needed by X11/XWayland shared memory).
  - --share=ipc
  # GPU acceleration for GTK/OpenGL rendering.
  - --device=dri
  # System tray icon via StatusNotifierItem / AppIndicator.
  - --talk-name=org.kde.StatusNotifierWatcher

# The GNOME runtime already provides GTK3, GLib, Cairo, Pango, gdk-pixbuf.
# We only add libayatana-appindicator (tray) and the app itself.

modules:
  # ---------------------------------------------------------------------------
  # System tray support, from flathub/shared-modules (git submodule).
  # ---------------------------------------------------------------------------
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # ---------------------------------------------------------------------------
  # WeatherWidget itself
  # ---------------------------------------------------------------------------
  - name: weatherwidget
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GO111MODULE: 'on'
        CGO_ENABLED: '1'
        GOWORK: 'off'
        CGO_CFLAGS: '-Wno-deprecated-declarations'
    build-commands:
      # All build + install logic lives in an upstream-maintained script
      # (in the app repo) so the manifest stays declarative. It builds offline
      # (-mod=vendor from ./vendor) and installs the binary, desktop entry,
      # AppStream metainfo, and icons.
      - bash flatpak/build-flatpak.sh
    sources:
      # Flathub requires a stable, pinned source (tag + commit).
      - type: git
        url: https://github.com/gcclinux/WeatherWidget.git
        tag: v2.0.7
        commit: 1f60cfe6fa1ea018ef0bd92886789ccc51a1b4f6
      # Generated by ./flatpak/generate-sources.sh (dennwc/flatpak-go-mod).
      # Populates ./vendor + ./vendor/modules.txt for an offline -mod=vendor
      # build. Keep AFTER the git source.
      - go.mod.yml
